<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח השמחות הכיתתי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue-deep: #0c4a6e;
            --blue-mid: #0369a1;
            --blue-bright: #0284c7;
            --blue-soft: #e0f2fe;
            --gold: #fbbf24;
            --gold-mid: #f59e0b;
            --gold-deep: #b45309;
            --gold-pale: #fef9c3;
            --ink: #0f172a;
            --white-glass: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Heebo', sans-serif;
        }

        body {
            background: linear-gradient(160deg, #f0f7ff 0%, #e8f2fe 50%, #fefce8 100%);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-decoration {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: floatOrb 16s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #bae6fd;
            top: -120px;
            right: -100px;
        }

        .orb-2 {
            width: 320px;
            height: 320px;
            background: #fde68a;
            bottom: -80px;
            left: -60px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 220px;
            height: 220px;
            background: #7dd3fc;
            top: 45%;
            left: 40%;
            animation-delay: -9s;
            opacity: 0.12;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(15px, -20px); }
        }

        .sparkle {
            display: none;
        }

        .floating-banner,
        .container { position: relative; z-index: 1; }

        .floating-banner {
            background: linear-gradient(135deg, #fef9c3, #fde047);
            color: #78350f;
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.35), 0 4px 16px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(253, 224, 71, 0.8);
            margin-bottom: 22px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: bounceIn 0.8s ease;
            max-width: 760px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .floating-banner:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 12px 40px rgba(251, 191, 36, 0.45);
        }

        @keyframes bounceIn {
            0% { transform: translateY(-24px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .container {
            display: flex;
            gap: 22px;
            max-width: 1320px;
            width: 100%;
            height: 690px;
        }

        .sidebar,
        .calendar-main {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(2, 132, 199, 0.1);
        }

        .sidebar {
            width: 380px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: 100%;
        }

        .brand-title {
            font-size: 23px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #d97706, #0284c7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-primary,
        .btn-gold,
        .btn-save {
            border: none;
            border-radius: 14px;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
        }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: white;
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.35);
        }

        .btn-primary:hover,
        .btn-gold:hover,
        .btn-save:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }

        .events-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--blue-deep);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue-soft), var(--gold-pale));
            flex-shrink: 0;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            overflow-y: auto;
            padding-left: 4px;
        }

        .events-list::-webkit-scrollbar { width: 6px; }
        .events-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .events-list::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--blue-bright), var(--gold-mid));
            border-radius: 10px;
        }

        .event-card {
            background: linear-gradient(135deg, #fffdf4, #ffffff);
            border: 1px solid #fde68a;
            border-right: 4px solid var(--gold-mid);
            padding: 12px 14px;
            border-radius: 14px;
            transition: all 0.22s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(2, 132, 199, 0.08);
            flex-shrink: 0;
        }

        .event-card:hover {
            transform: translateX(-3px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.18);
        }

        .event-name {
            font-weight: 800;
            font-size: 13px;
            color: #78350f;
        }

        .event-details {
            font-size: 11px;
            color: var(--gold-deep);
            display: flex;
            gap: 10px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .event-actions-btns { display: flex; gap: 6px; }

        .icon-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            font-size: 12px;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--blue-soft);
            border-color: #7dd3fc;
            transform: scale(1.08);
        }

        .calendar-main {
            flex: 1;
            padding: 28px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #f0f9ff, #fefce8);
            border: 1px solid #bae6fd;
            padding: 16px 24px;
            border-radius: 18px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .calendar-scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            padding-left: 4px;
            margin-right: -4px;
            min-height: 420px;
        }

        .calendar-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 420px;
            font-size: 18px;
            font-weight: 800;
            color: var(--blue-mid);
        }

        .calendar-scroll-area::-webkit-scrollbar { width: 8px; }
        .calendar-scroll-area::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .calendar-scroll-area::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--blue-bright), var(--gold-mid));
            border-radius: 10px;
        }

        .month-section {
            height: 100%;
            min-height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .month-section .days-grid {
            flex: 1;
            min-height: 0;
            grid-template-rows: repeat(6, 1fr);
        }

        .calendar-header h2 {
            font-size: 21px;
            font-weight: 900;
            color: var(--blue-deep);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hebrew-month-badge {
            font-size: 12px;
            font-weight: 800;
            color: var(--gold-deep);
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid #fcd34d;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(251, 191, 36, 0.2);
        }

        .hebrew-date-hint {
            font-size: 12px;
            color: var(--gold-deep);
            font-weight: 700;
            margin-top: -8px;
            min-height: 18px;
            padding: 6px 10px;
            background: #fffbeb;
            border-radius: 10px;
            border: 1px solid #fde68a;
        }

        .dual-date { display: flex; flex-direction: column; gap: 2px; }
        .dual-date .hebrew-date-line {
            font-size: 10px;
            color: var(--gold-deep);
            font-weight: 700;
        }

        .nav-btn {
            background: #ffffff;
            border: 1px solid #bae6fd;
            color: var(--blue-deep);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.22s;
            font-size: 16px;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.1);
        }

        .nav-btn:hover {
            background: var(--blue-bright);
            border-color: var(--blue-bright);
            color: white;
            transform: scale(1.06);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 800;
            color: var(--blue-mid);
            margin-bottom: 12px;
            font-size: 13px;
            gap: 6px;
            flex-shrink: 0;
        }

        .weekdays div {
            padding: 8px 4px;
            border-radius: 10px;
            background: #f0f9ff;
        }

        .weekdays div:last-child {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: var(--gold-deep);
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-cell {
            background: #f8fafc;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border: 1px solid #e2e8f0;
            transition: all 0.22s ease;
            cursor: pointer;
            overflow: hidden;
            gap: 6px;
            min-height: 0;
            height: 100%;
        }

        .day-cell:hover {
            border-color: #38bdf8;
            background: #f0f9ff;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.14);
            transform: translateY(-2px);
        }

        .day-cell.today {
            background: linear-gradient(145deg, #e0f2fe, #fef9c3);
            border: 2px solid var(--blue-bright);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25);
        }

        .day-cell.today .day-number { color: var(--blue-deep); }

        .day-cell.has-event {
            background: linear-gradient(145deg, #fffdf4, #f8fafc);
            border-color: #fcd34d;
        }

        .day-cell.saturday {
            background: #fffbeb;
        }

        .day-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
            box-shadow: none;
            min-height: auto;
        }

        .day-cell.empty:hover {
            transform: none;
            background: transparent;
            box-shadow: none;
        }

        .day-numbers {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 4px;
        }

        .day-number {
            font-weight: 800;
            font-size: 16px;
            color: #334155;
            line-height: 1.1;
        }

        .hebrew-day-number {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-deep);
            line-height: 1.1;
            text-align: left;
            direction: rtl;
            background: rgba(251, 191, 36, 0.15);
            padding: 2px 6px;
            border-radius: 8px;
        }

        .cell-event {
            background: linear-gradient(135deg, #fef9c3, #fde047);
            color: #78350f;
            font-size: 10px;
            padding: 4px 7px;
            border-radius: 8px;
            font-weight: 800;
            border-right: 3px solid var(--gold-mid);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 36px;
            border-radius: 24px;
            width: 460px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 25px 60px rgba(8, 47, 73, 0.3);
            animation: modalAppear 0.3s ease;
        }

        .modal-content.wide { width: 680px; }

        @keyframes modalAppear {
            from { transform: scale(0.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            color: var(--blue-deep);
            font-size: 22px;
            font-weight: 900;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            margin-top: -12px;
            line-height: 1.5;
        }

        .modal-content label {
            font-size: 13px;
            font-weight: 700;
            color: var(--blue-deep);
            margin-bottom: -10px;
        }

        .modal-content input {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--ink);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .modal-content input:focus {
            border-color: var(--blue-bright);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-save {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover { background: #e2e8f0; }

        .events-table-container {
            max-height: 350px;
            overflow-y: auto;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .events-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 14px;
        }

        .events-table th {
            background: linear-gradient(135deg, #f0f9ff, #fef9c3);
            color: var(--blue-deep);
            padding: 14px 12px;
            font-weight: 800;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
        }

        .events-table td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        .events-table tr:hover { background: #f8fafc; }
        .table-actions { display: flex; gap: 6px; }

        @media (max-width: 900px) {
            .container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; height: 500px; }
            .calendar-main { height: auto; min-height: 520px; }
            .modal-content.wide { width: 100%; }
            body { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="bg-decoration">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

    <div class="floating-banner" id="floatingBanner" onclick="showRandomQuote()" title="לחצי עליי – יש עוד בדיחה בחינם!">
        ✨ טוענת בדיחות ושמחות...
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="brand-title">✨ השמחות שלנו ✨</div>

            <div class="action-btns">
                <button class="btn-primary" onclick="openModal()">+ עוד שמחה! (כי למה לא)</button>
                <button class="btn-gold" onclick="openAllEventsModal()">💍 כל החתונות – הרשימה הרשמית</button>
            </div>

            <div class="events-title">
                <span>🥂 מי חוגגת בקרוב?</span>
            </div>
            
            <div class="events-list" id="eventsList"></div>
        </div>

        <div class="calendar-main">
            <div class="calendar-header">
                <button class="nav-btn" onclick="scrollToAdjacentMonth(-1)" title="חודש קודם">&#10094;</button>
                <h2 id="monthYearDisplay">
                    <span id="gregorianTitle">חודש שנה</span>
                    <span class="hebrew-month-badge" id="hebrewMonthBadge">חודש עברי</span>
                </h2>
                <button class="nav-btn" onclick="scrollToAdjacentMonth(1)" title="חודש הבא">&#10095;</button>
            </div>

            <div class="weekdays">
                <div>א'</div>
                <div>ב'</div>
                <div>ג'</div>
                <div>ד'</div>
                <div>ה'</div>
                <div>ו'</div>
                <div>שבת</div>
            </div>

            <div class="calendar-scroll-area" id="calendarScrollArea"></div>
        </div>
    </div>

    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 id="modalTitleText">✨ הוספת שמחה חדשה</h3>
            <p class="modal-subtitle" id="modalSubtitle"></p>
            <input type="hidden" id="editEventIdInput" value="">
            <label>מי חוגגת ומה חוגגים? 🎊</label>
            <input type="text" id="eventTitleInput" placeholder="למשל: 💍 חתונה תהילה אלוש (עם כוכבית!)">
            <label>מתי? (לועזי, כי ככה עובד Google Calendar) 📅</label>
            <input type="date" id="eventDateInput" onchange="updateHebrewDateHint()">
            <div class="hebrew-date-hint" id="hebrewDateHint"></div>
            <label>באיזו שעה מתחילים לרקוד? 💃</label>
            <input type="time" id="eventTimeInput" value="19:00">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">לא עכשיו, תודה</button>
                <button class="btn-save" id="saveEventBtn" onclick="saveEvent()">יאללה, שמרי! 🎉</button>
            </div>
        </div>
    </div>

    <div class="modal" id="allEventsModal">
        <div class="modal-content wide">
            <h3>💍 כל החתונות – מסודר ומוכן </h3>
            <p class="modal-subtitle">כאן רואים מי כבר בדרך לחופה ומי עוד בתור ✨</p>
            <div class="events-table-container">
                <table class="events-table">
                    <thead>
                        <tr>
                            <th>השמחה</th>
                            <th>מתי (לועזי + עברי)</th>
                            <th>שעת הריקודים</th>
                            <th>מה עושים?</th>
                        </tr>
                    </thead>
                    <tbody id="allEventsTableBody"></tbody>
                </table>
            </div>
            <div class="modal-actions">
                <button class="btn-save" onclick="closeAllEventsModal()">סגרתי, חזרתי לחגוג 🥂</button>
            </div>
        </div>
    </div>

    <script>
        let today = new Date();
        let currentHebrewYear;
        let currentHebrewMonth;
        let hasInitialScroll = false;

        const monthsNames = [
            "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
            "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
        ];

        const hebrewPartsFormatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        function hebrewNumberToLetters(num, isYear = false) {
            if (num <= 0) return '';

            let n = isYear ? num % 1000 : num;

            if (!isYear) {
                if (n === 15) return 'ט\u05F4ו';
                if (n === 16) return 'ט\u05F4ז';
            }

            const values = [
                [400, '\u05EA'], [300, '\u05E9'], [200, '\u05E8'], [100, '\u05E7'],
                [90, '\u05E6'], [80, '\u05E4'], [70, '\u05E2'], [60, '\u05E1'], [50, '\u05E0'],
                [40, '\u05DE'], [30, '\u05DC'], [20, '\u05DB'], [10, '\u05D9'],
                [9, '\u05D8'], [8, '\u05D7'], [7, '\u05D6'], [6, '\u05D5'], [5, '\u05D4'],
                [4, '\u05D3'], [3, '\u05D2'], [2, '\u05D1'], [1, '\u05D0']
            ];

            let remaining = n;
            let letters = '';

            for (const [value, letter] of values) {
                while (remaining >= value) {
                    letters += letter;
                    remaining -= value;
                }
            }

            if (letters.length > 1) {
                return letters.slice(0, -1) + '\u05F4' + letters.slice(-1);
            }
            if (letters.length === 1) {
                return letters + '\u05F3';
            }
            return letters;

            const cacheKey = getHebrewMonthCacheKey(hebrewYear, hebrewMonthName);
            const cached = hebrewMonthRangeCache.get(cacheKey);
            if (cached && cached.start) {
                return new Date(cached.start.getTime());
            }

            const searchStart = new Date(hebrewYear - 3761, 8, 1);
            const searchEnd = new Date(hebrewYear - 3760, 10, 30);

            for (let d = new Date(searchStart); d <= searchEnd; d.setDate(d.getDate() + 1)) {
                const parts = getHebrewDateParts(new Date(d.getTime()));
                if (parts.year === hebrewYear && parts.month === hebrewMonthName && parts.day === 1) {

            const cacheKey = getHebrewMonthCacheKey(hebrewYear, hebrewMonthName);
            if (hebrewMonthRangeCache.has(cacheKey)) {
                const cached = hebrewMonthRangeCache.get(cacheKey);
                return {
                    start: cached.start ? new Date(cached.start.getTime()) : null,
                    end: cached.end ? new Date(cached.end.getTime()) : null,
                    dayCount: cached.dayCount
                };
            }

            const start = findFirstDayOfHebrewMonth(hebrewYear, hebrewMonthName);
            if (!start) {
                const emptyRange = { start: null, end: null, dayCount: 0 };
                hebrewMonthRangeCache.set(cacheKey, emptyRange);
                return emptyRange;
            }

            let end = new Date(start.getTime());
            let dayCount = 1;

            while (true) {
                const next = new Date(end.getTime());
                next.setDate(next.getDate() + 1);
                const parts = getHebrewDateParts(next);
                if (parts.year !== hebrewYear || parts.month !== hebrewMonthName) {

                end = next;
                dayCount++;

            const range = { start, end, dayCount };
            hebrewMonthRangeCache.set(cacheKey, range);
            return range;

        function getAdjacentHebrewMonth(hebrewYear, hebrewMonthName, direction) {
            const range = getHebrewMonthRange(hebrewYear, hebrewMonthName);
            if (!range.start) {
                const fallback = new Date(today.getTime());
                fallback.setDate(fallback.getDate() + (direction > 0 ? 30 : -30));
                return getHebrewMonthInfo(fallback);
            }

            const pivot = new Date(range.start.getTime());

            if (direction > 0) {
                pivot.setDate(pivot.getDate() + range.dayCount);

            const aRange = getHebrewMonthRange(aYear, aMonth);

                    <div class="day-numbers">
                        <div class="day-number">${day}</div>
                        <div class="hebrew-day-number" title="${formatHebrewFullDate(cellDate)}">${hebrewDay}</div>
                    </div>
                    <div>${eventsHtml}</div>
                `;
                daysGrid.appendChild(cell);

                cursor.setDate(cursor.getDate() + 1);
            }

            section.appendChild(daysGrid);
            return section;
        }

        function scrollToHebrewMonthSection(hebrewYear, hebrewMonth, behavior = 'smooth') {
            const scrollArea = document.getElementById('calendarScrollArea');
            const sections = Array.from(scrollArea.querySelectorAll('.month-section'));
            const target = scrollArea.querySelector(
                `[data-hebrew-year="${hebrewYear}"][data-hebrew-month="${cssEscape(hebrewMonth)}"]`
            );
            if (!target) return;

            const index = sections.indexOf(target);
            if (index === -1) return;

            scrollArea.scrollTo({
                top: index * scrollArea.clientHeight,
                behavior
            });
        }

        function scrollToAdjacentMonth(direction) {
            const next = getAdjacentHebrewMonth(currentHebrewYear, currentHebrewMonth, direction);
            updateStickyHeader(next.year, next.month);
            scrollToHebrewMonthSection(next.year, next.month);
        }

        function setupScrollHeaderSync() {
            const scrollArea = document.getElementById('calendarScrollArea');
            if (scrollArea.dataset.syncBound === 'true') return;

            scrollArea.dataset.syncBound = 'true';
            scrollArea.addEventListener('scroll', () => {
                const sections = scrollArea.querySelectorAll('.month-section');
                if (!sections.length) return;

                const viewportHeight = scrollArea.clientHeight || 1;
                const index = Math.min(
                    sections.length - 1,
                    Math.max(0, Math.round(scrollArea.scrollTop / viewportHeight))
                );
                const activeSection = sections[index];

                const year = parseInt(activeSection.dataset.hebrewYear, 10);
                const month = activeSection.dataset.hebrewMonth;
                if (year !== currentHebrewYear || month !== currentHebrewMonth) {
                    updateStickyHeader(year, month);
                }
            }, { passive: true });
        }

        function renderCalendar() {
            const scrollArea = document.getElementById('calendarScrollArea');
            scrollArea.innerHTML = '<div class="calendar-loading">טוענת לוח... 📅</div>';

            try {
                let targetYear = currentHebrewYear;
                let targetMonth = currentHebrewMonth;

                if (!hasInitialScroll) {
                    const todayInfo = getHebrewMonthInfo(today);
                    targetYear = todayInfo.year;
                    targetMonth = todayInfo.month;
                    currentHebrewYear = targetYear;
                    currentHebrewMonth = targetMonth;
                }

                const { startYear, startMonth, endYear, endMonth } = getCalendarHebrewMonthRange();
                const fragment = document.createDocumentFragment();

                iterateHebrewMonths(startYear, startMonth, endYear, endMonth, (year, month) => {
                    fragment.appendChild(buildHebrewMonthSection(year, month));
                });

                scrollArea.innerHTML = '';
                scrollArea.appendChild(fragment);

                updateStickyHeader(targetYear, targetMonth);
                setupScrollHeaderSync();

                const scrollToTarget = () => scrollToHebrewMonthSection(targetYear, targetMonth, 'auto');
                requestAnimationFrame(() => {
                    scrollToTarget();
                    requestAnimationFrame(scrollToTarget);
                });

                if (!hasInitialScroll) {
                    hasInitialScroll = true;
                }

                renderSidebarEvents();
            } catch (error) {
                console.error(error);
                scrollArea.innerHTML = '<div class="calendar-loading" style="color:#b45309;">לא הצלחנו לטעון את הלוח. רענני את הדף (F5).</div>';
            }
        }

        function changeMonth(direction) {
            scrollToAdjacentMonth(direction);
        }

        function renderSidebarEvents() {
            const eventsList = document.getElementById('eventsList');
            eventsList.innerHTML = '';
            
            let sortedEvents = [...events]
                .filter(isUpcomingEvent)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedEvents.forEach((ev) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-info">
                        <div class="event-name">${ev.title}</div>
                        <div class="event-details">
                            <span class="dual-date">
                                <span>📅 ${formatGregorianDisplay(ev.date)}</span>
                                <span class="hebrew-date-line">${formatHebrewFullDateFromString(ev.date)}</span>
                            </span>
                            <span>⏰ ${ev.time}</span>
                        </div>
                    </div>
                    <div class="event-actions-btns">
                        <button class="icon-btn" onclick="editEvent(${ev.id})" title="לערוך – כי טעויות קורות">✏️</button>
                        <button class="icon-btn" onclick="deleteEvent(${ev.id})" title="למחוק – בזהירות!">🗑️</button>
                    </div>
                `;
                eventsList.appendChild(card);
            });
        }

        function openModal() {
            document.getElementById('editEventIdInput').value = "";
            document.getElementById('modalTitleText').innerText = "✨ עוד שמחה נכנסת ללוח!";
            setModalSubtitle(false);
            document.getElementById('eventTitleInput').value = "";
            document.getElementById('eventDateInput').value = "";
            document.getElementById('eventTimeInput').value = "19:00";
            updateHebrewDateHint();
            document.getElementById('eventModal').style.display = 'flex';
        }

        function openModalForDate(dateStr) {
            document.getElementById('editEventIdInput').value = "";
            document.getElementById('modalTitleText').innerText = "📅 יום מושלם לשמחה!";
            setModalSubtitle(false);
            document.getElementById('eventTitleInput').value = "";
            document.getElementById('eventDateInput').value = dateStr;
            document.getElementById('eventTimeInput').value = "19:00";
            updateHebrewDateHint();
            document.getElementById('eventModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        async function saveEvent() {
            if (isSyncing) return;

            const title = document.getElementById('eventTitleInput').value;
            const date = document.getElementById('eventDateInput').value;
            const time = document.getElementById('eventTimeInput').value;
            const editEventId = document.getElementById('editEventIdInput').value;

            if (!title || !date) {
                alert(pickRandom(emptyFormAlerts));
                return;
            }

            isSyncing = true;
            setSaveButtonLoading(true);

            try {
                if (usesGoogleSheets()) {
                    if (editEventId) {
                        await sendEventChangeToGoogle({
                            action: 'update',
                            id: Number(editEventId),
                            title,
                            date,
                            time
                        });
                    } else {
                        await sendEventChangeToGoogle({
                            action: 'add',
                            title,
                            date,
                            time
                        });
                    }
                    await syncEventsAfterChange();
                } else if (editEventId) {
                    const eventIndex = events.findIndex((ev) => Number(ev.id) === Number(editEventId));
                    if (eventIndex !== -1) {
                        events[eventIndex] = {
                            id: Number(editEventId),
                            title,
                            date,
                            time
                        };
                    }
                    saveEventsToStorage();
                } else {
                    events.push({
                        id: getNextLocalEventId(),
                        title,
                        date,
                        time
                    });
                    saveEventsToStorage();
                }

                renderCalendar();
                closeModal();

                if (document.getElementById('allEventsModal').style.display === 'flex') {
                    openAllEventsModal();
                }
            } catch (e) {
                alert(getGoogleErrorMessage(e));
                console.error(e);
            } finally {
                isSyncing = false;
                setSaveButtonLoading(false);
            }
        }

        function editEvent(eventId) {
            const ev = events.find((item) => Number(item.id) === Number(eventId));
            if (!ev) return;

            document.getElementById('editEventIdInput').value = ev.id;
            document.getElementById('modalTitleText').innerText = "✏️ טיפול חירום לשמחה";
            setModalSubtitle(true);
            document.getElementById('eventTitleInput').value = ev.title;
            document.getElementById('eventDateInput').value = ev.date;
            document.getElementById('eventTimeInput').value = ev.time;
            updateHebrewDateHint();
            document.getElementById('eventModal').style.display = 'flex';
        }

        async function deleteEvent(eventId) {
            if (isSyncing) return;
            if (!confirm(pickRandom(deleteConfirmMessages))) return;

            isSyncing = true;

            try {
                if (usesGoogleSheets()) {
                    await sendEventChangeToGoogle({
                        action: 'delete',
                        id: Number(eventId)
                    });
                    await syncEventsAfterChange();
                } else {
                    events = events.filter((ev) => Number(ev.id) !== Number(eventId));
                    saveEventsToStorage();
                }

                renderCalendar();

                if (document.getElementById('allEventsModal').style.display === 'flex') {
                    openAllEventsModal();
                }
            } catch (e) {
                alert(getGoogleErrorMessage(e));
                console.error(e);
            } finally {
                isSyncing = false;
            }
        }

        function openAllEventsModal() {
            const tbody = document.getElementById('allEventsTableBody');
            tbody.innerHTML = '';
            
            let sortedEvents = [...events]
                .filter(isUpcomingEvent)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedEvents.forEach((ev) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${ev.title}</strong></td>
                    <td>
                        <div class="dual-date">
                            <span>📅 ${formatGregorianDisplay(ev.date)}</span>
                            <span class="hebrew-date-line">${formatHebrewFullDateFromString(ev.date)}</span>
                        </div>
                    </td>
                    <td>⏰ ${ev.time}</td>
                    <td>
                        <div class="table-actions">
                            <button class="icon-btn" onclick="closeAllEventsModal(); editEvent(${ev.id});" title="לערוך">✏️</button>
                            <button class="icon-btn" onclick="deleteEvent(${ev.id});" title="למחוק בזהירות">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
            document.getElementById('allEventsModal').style.display = 'flex';
        }

        function closeAllEventsModal() {
            document.getElementById('allEventsModal').style.display = 'none';
        }

        async function initApp() {
            try {
                showRandomQuote();
                events = loadEventsFromStorage();
                renderCalendar();

                if (!usesGoogleSheets()) return;

                const banner = document.getElementById('floatingBanner');
                banner.innerText = '☁️ טוענת שמחות מהענן...';

                const loadedFromCloud = await loadEventsFromGoogleInBackground();
                if (loadedFromCloud) {
                    renderCalendar();
                }

                showRandomQuote();
            } catch (error) {
                console.error(error);
                document.getElementById('floatingBanner').innerText = 'משהו נתקע בטעינה – נסי F5';
            }
        }

        initApp();
    </script>
</body>
</html>
